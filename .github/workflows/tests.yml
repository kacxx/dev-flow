name: tests

# #25: D1 triggers, D2 OSes and Python, D3 with and without PyYAML, D4 every test_*.py
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels the run it replaces; runs on main all finish (D1).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: ${{ matrix.os }}, ${{ matrix.pyyaml }} PyYAML
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, not -latest: setup-python only installs 3.9 where the image has a build for it.
        os: [ubuntu-24.04, windows-2022]
        pyyaml: [without, with]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install PyYAML
        if: matrix.pyyaml == 'with'
        run: python -m pip install pyyaml==6.0.2
      # Fail loudly if the job isn't testing the parser it says it is.
      - name: Check PyYAML is ${{ matrix.pyyaml == 'with' && 'importable' || 'absent' }}
        run: python -I -c "import importlib.util, sys; found = importlib.util.find_spec('yaml') is not None; sys.exit(0 if found == ('${{ matrix.pyyaml }}' == 'with') else 1)"
      - name: Run every test_*.py
        run: python -I scripts/run_tests.py
